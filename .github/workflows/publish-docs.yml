name: Publish docs

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docs version to deploy (e.g. 0.1.3)'
        required: true
        type: string
      aliases:
        description: 'Optional space-separated aliases (e.g. "latest" or "latest dev")'
        required: false
        type: string
      delete_old_versions:
        description: 'Delete old docs versions after deployment'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_docs:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install zensical==0.0.50 git+https://github.com/squidfunk/mike.git

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Get VERSION_NAME
        id: version_name
        run: echo "VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Resolve docs deployment
        id: docs
        env:
          VERSION_NAME: ${{ steps.version_name.outputs.VERSION_NAME }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            docs_version="${{ inputs.version }}"
            docs_aliases="${{ inputs.aliases }}"
          elif echo "$VERSION_NAME" | grep -q "SNAPSHOT"; then
            docs_version="dev"
            docs_aliases=""
          else
            docs_version="$VERSION_NAME"
            docs_aliases="latest"
          fi
          echo "version=$docs_version" >> $GITHUB_OUTPUT
          echo "aliases=$docs_aliases" >> $GITHUB_OUTPUT
          echo "Resolved: version=$docs_version aliases=$docs_aliases"

      - name: Configure git for mike
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin gh-pages --depth=1 || true

      - name: Build docs
        env:
          DEVVIEW_VERSION: ${{ steps.docs.outputs.version }}
        run: ./scripts/build_docs.sh --prep-only

      - name: Deploy docs with mike
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
          DOCS_ALIASES: ${{ steps.docs.outputs.aliases }}
        run: mike deploy -u --push $DOCS_VERSION $DOCS_ALIASES

      - name: Set default version
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && steps.docs.outputs.aliases != ''
        run: mike set-default --push latest

      - name: Delete old doc versions
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.delete_old_versions)
        run: |
          git fetch origin gh-pages --depth=1
          ./scripts/delete_old_version_docs.sh
