repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        verbose: true
        args: ['-c', 'config/gitleaks/.gitleaks.toml']
  - repo: local
    hooks:
      - id: detekt
        name: Detekt
        entry: bash -c './gradlew detektFull -Pandroidx.baselineprofile.skipgeneration && git diff --exit-code'
        language: system
        pass_filenames: false
        verbose: true
